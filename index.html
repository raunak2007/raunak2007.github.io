<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Raunak's Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@v0.182.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.182.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: 'Nunito', sans-serif; }
    #loadingScreen {
      position: fixed; inset: 0; z-index: 10000;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; transition: opacity 0.5s ease-out;
    }
    #loadingScreen.fade-out { opacity: 0; pointer-events: none; }
    .loading-logo {
      width: 120px; height: 120px;
      background: linear-gradient(135deg, #e94560, #ff6b6b);
      border-radius: 24px; margin-bottom: 30px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 60px rgba(233,69,96,0.4);
      animation: logoPulse 2s ease-in-out infinite;
    }
    .loading-logo span {
      font-family: 'Fredoka One', cursive; font-size: 48px; color: white;
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    #loadingText {
      color: white; font-family: 'Fredoka One', cursive;
      font-size: 22px; letter-spacing: 3px; opacity: 0.9;
      text-shadow: 0 0 20px rgba(233,69,96,0.5);
    }
    #loadingPercent {
      color: #e94560; font-family: 'Fredoka One', cursive;
      font-size: 16px; margin-top: 8px;
    }
    .loading-bar-outer {
      width: 280px; height: 8px; background: rgba(255,255,255,0.1);
      border-radius: 4px; margin-top: 20px; overflow: hidden;
    }
    .loading-bar-inner {
      height: 100%; width: 0%; border-radius: 4px;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      transition: width 0.3s ease;
    }
    #orientationModal {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(26,26,46,0.98);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fredoka One', cursive; color: white;
    }
    #orientationModal.hidden { display: none; }
    #orientationModal h1 { font-size: 2rem; margin-bottom: 1rem; }
    #orientationModal p { font-size: 1rem; opacity: 0.7; font-family: 'Nunito', sans-serif; }
    @media (orientation: landscape) { #orientationModal { display: none !important; } }
    .side-nav {
      position: fixed; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s ease;
    }
    .side-nav.left { left: 0; top: 0; width: 60px; height: 100vh; }
    .side-nav.right { right: 0; top: 0; width: 60px; height: 100vh; }
    .side-nav.bottom { bottom: 0; left: 0; width: 100%; height: 60px; }
    .side-nav:hover { background: rgba(233,69,96,0.15); }

    .nav-button {
      background: none; border: none; cursor: pointer;
      font-family: 'Fredoka One', cursive; font-size: 16px;
      color: white; letter-spacing: 2px; text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      transition: all 0.3s ease; padding: 0;
    }
    .side-nav.left .nav-button { writing-mode: sideways-lr; }
    .side-nav.right .nav-button { writing-mode: vertical-rl; }
    .side-nav:hover .nav-button { text-shadow: 0 0 20px rgba(233,69,96,0.8); transform: scale(1.05); }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 1001;
      align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
    }
    .modal-overlay.active { display: flex; }
    .modal-container {
      width: min(600px, 90vw); max-height: 80vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 20px; border: 2px solid rgba(233,69,96,0.3);
      box-shadow: 0 0 60px rgba(233,69,96,0.2), 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .modal-header {
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      padding: 18px 24px; display: flex;
      align-items: center; justify-content: space-between;
    }
    .modal-header h2 {
      font-family: 'Fredoka One', cursive; color: white;
      font-size: 20px; letter-spacing: 1px;
    }
    .modal-close {
      background: rgba(255,255,255,0.2); border: none;
      color: white; width: 32px; height: 32px; border-radius: 8px;
      font-size: 18px; cursor: pointer; transition: background 0.2s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.3); }
    .modal-body {
      padding: 24px; color: #ddd; font-size: 15px; line-height: 1.7;
      max-height: 60vh; overflow-y: auto;
    }
    .modal-body h3 {
      font-family: 'Fredoka One', cursive; color: #e94560;
      font-size: 17px; margin: 16px 0 8px 0;
    }
    .modal-body h3:first-child { margin-top: 0; }
    .modal-body p { margin-bottom: 8px; }
    .modal-body .tag {
      display: inline-block; background: rgba(233,69,96,0.15);
      color: #ff6b6b; padding: 3px 10px; border-radius: 6px;
      font-size: 12px; font-weight: 700; margin: 2px 4px 2px 0;
    }
    .modal-nav {
      display: flex; justify-content: space-between; padding: 16px 24px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .modal-nav button {
      background: rgba(233,69,96,0.15); border: 1px solid rgba(233,69,96,0.3);
      color: #ff6b6b; padding: 8px 20px; border-radius: 8px;
      font-family: 'Fredoka One', cursive; font-size: 13px;
      cursor: pointer; transition: all 0.2s;
    }
    .modal-nav button:hover { background: rgba(233,69,96,0.3); }
    .modal-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
    .notif {
      position: fixed; left: 50%; bottom: 40px;
      transform: translateX(-50%) translateY(100px);
      color: white; padding: 14px 28px; border-radius: 12px;
      font-size: 16px; font-family: 'Fredoka One', cursive;
      background: linear-gradient(135deg, #e94560, #ff6b6b);
      box-shadow: 0 8px 30px rgba(233,69,96,0.4);
      opacity: 0; z-index: 1000; pointer-events: none;
      transition: all 0.4s cubic-bezier(.68,-0.6,.32,1.6);
    }
    .notif.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }
    .modal-body::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb { background: rgba(233,69,96,0.3); border-radius: 3px; }
    canvas { cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="orientationModal" class="hidden">
    <div style="text-align:center">
      <h1>📱 Rotate to Landscape</h1>
      <p>Please rotate your device for the best experience</p>
    </div>
  </div>
  <div id="loadingScreen">
    <div class="loading-logo"><span>R</span></div>
    <div id="loadingText">Loading World...</div>
    <div id="loadingPercent">0%</div>
    <div class="loading-bar-outer"><div class="loading-bar-inner" id="loadingBar"></div></div>
  </div>
  <div class="side-nav left" style="opacity:0;pointer-events:none;">
    <button class="nav-button" id="navLeftBtn">Experience</button>
  </div>
  <div class="side-nav right" style="opacity:0;pointer-events:none;">
    <button class="nav-button" id="navRightBtn">About Me</button>
  </div>
  <div class="side-nav bottom" style="opacity:0;pointer-events:none;">
    <button class="nav-button" id="navBottomBtn">Projects</button>
  </div>

  <div id="infoModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="modalTitle">Info</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-nav">
        <button id="modalPrev">&larr; Previous</button>
        <button id="modalNext">Next &rarr;</button>
      </div>
    </div>
  </div>

  <div id="notif" class="notif">Email copied!</div>

  <script type="module">
    import * as THREE from 'three';
    function checkOrientation() {
      const m = document.getElementById('orientationModal');
      if (window.innerHeight > window.innerWidth) m.classList.remove('hidden');
      else m.classList.add('hidden');
    }
    window.addEventListener('load', checkOrientation);
    window.addEventListener('resize', checkOrientation);
    let loadProgress = 0;
    function setLoadProgress(p) {
      loadProgress = p;
      document.getElementById('loadingPercent').textContent = Math.round(p * 100) + '%';
      document.getElementById('loadingBar').style.width = (p * 100) + '%';
      if (p >= 1) {
        document.getElementById('loadingText').textContent = 'Click to enter...';
      }
    }
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    const skyGeo = new THREE.SphereGeometry(400, 32, 16);
    skyGeo.scale(-1, 1, 1);
    const skyMat = new THREE.ShaderMaterial({
      uniforms: { time: { value: 0.35 } },
      vertexShader: `
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        }
      `,
      fragmentShader: `
        uniform float time;
        varying vec3 vDir;
        void main() {
          float h = vDir.y * 0.5 + 0.5;
          vec3 top = vec3(0.35, 0.55, 0.95);
          vec3 horizon = vec3(0.7, 0.85, 1.0);
          vec3 ground = vec3(0.15, 0.2, 0.35);
          vec3 col = h > 0.5 ? mix(horizon, top, (h-0.5)*2.0) : mix(ground, horizon, h*2.0);
          vec3 sunDir = normalize(vec3(0.5, 0.6, -0.8));
          float sunDot = max(dot(normalize(vDir), sunDir), 0.0);
          col += vec3(1.0, 0.9, 0.7) * pow(sunDot, 64.0) * 1.5;
          col += vec3(1.0, 0.7, 0.4) * pow(sunDot, 8.0) * 0.3;
          gl_FragColor = vec4(col, 1.0);
        }
      `,
      side: THREE.FrontSide, depthWrite: false
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));
    const ambientLight = new THREE.AmbientLight(0x8899cc, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffeedd, 2.0);
    sunLight.position.set(20, 30, -30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -30;
    sunLight.shadow.camera.right = 30;
    sunLight.shadow.camera.top = 30;
    sunLight.shadow.camera.bottom = -30;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xaaccff, 0.4);
    fillLight.position.set(-10, 10, 20);
    scene.add(fillLight);
    function robloxMat(color) {
      return new THREE.MeshStandardMaterial({
        color, roughness: 0.4, metalness: 0.0
      });
    }
    const baseplateGeo = new THREE.BoxGeometry(60, 1, 60);
    const baseplateMat = robloxMat(0x3d9140); 
    const baseplate = new THREE.Mesh(baseplateGeo, baseplateMat);
    baseplate.position.y = -0.5;
    baseplate.receiveShadow = true;
    scene.add(baseplate);

    const studGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.08, 8);
    const studMat = robloxMat(0x4aad4e);
    for (let x = -14; x <= 14; x += 2) {
      for (let z = -14; z <= 14; z += 2) {
        const stud = new THREE.Mesh(studGeo, studMat);
        stud.position.set(x, 0.04, z);
        stud.receiveShadow = true;
        scene.add(stud);
      }
    }
    function createPart(w, h, d, color, x, y, z) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = robloxMat(color);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function createNoob(x, y, z, rotation = 0) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotation;
      const head = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 1.2, 1.2),
        robloxMat(0xf3d94e)
      );
      head.position.y = 3.6;
      head.castShadow = true;
      group.add(head);
      const eyeMat = robloxMat(0x1a1a1a);
      const eyeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.05);
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.25, 3.7, 0.61);
      group.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.25, 3.7, 0.61);
      group.add(rightEye);

      const smileMat = robloxMat(0x1a1a1a);
      const smileGeo = new THREE.BoxGeometry(0.5, 0.08, 0.05);
      const smile = new THREE.Mesh(smileGeo, smileMat);
      smile.position.set(0, 3.4, 0.61);
      group.add(smile);
      const torso = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 1.6, 0.8),
        robloxMat(0x0055aa)
      );
      torso.position.y = 2.2;
      torso.castShadow = true;
      group.add(torso);

      const armGeo = new THREE.BoxGeometry(0.6, 1.6, 0.8);
      const armMat = robloxMat(0xf3d94e);
      const leftArm = new THREE.Mesh(armGeo, armMat);
      leftArm.position.set(-1.1, 2.2, 0);
      leftArm.castShadow = true;
      group.add(leftArm);
      const rightArm = new THREE.Mesh(armGeo, armMat);
      rightArm.position.set(1.1, 2.2, 0);
      rightArm.castShadow = true;
      group.add(rightArm);

      const legGeo = new THREE.BoxGeometry(0.8, 1.4, 0.8);
      const legMat = robloxMat(0x00882a);
      const leftLeg = new THREE.Mesh(legGeo, legMat);
      leftLeg.position.set(-0.4, 0.7, 0);
      leftLeg.castShadow = true;
      group.add(leftLeg);
      const rightLeg = new THREE.Mesh(legGeo, legMat);
      rightLeg.position.set(0.4, 0.7, 0);
      rightLeg.castShadow = true;
      group.add(rightLeg);

      scene.add(group);
      return group;
    }

    createPart(8, 0.4, 8, 0x6e6e6e, 0, 0.2, 0); 

    createPart(8.4, 0.1, 8.4, 0xe94560, 0.0, 0.42, 0); 

    
    const signBack = createPart(7, 3, 0.3, 0x222244, 0, 2.5, -3.85);
 
    createPart(7.2, 0.1, 0.1, 0xe94560, 0, 4.05, -3.8);
    createPart(7.2, 0.1, 0.1, 0xe94560, 0, 0.95, -3.8);
    createPart(0.1, 3.2, 0.1, 0xe94560, -3.55, 2.5, -3.8);
    createPart(0.1, 3.2, 0.1, 0xe94560, 3.55, 2.5, -3.8);

   
    const mainNoob = createNoob(0, 0.4, 0, 0);

    createPart(6, 0.3, 6, 0x4488cc, 10, 0.15, 0);
    
    createPart(5, 3.5, 0.3, 0x222244, 10, 2.2, -2.85);
    createPart(5.2, 0.1, 0.1, 0x00cc88, 10, 4.0, -2.8);
    createPart(5.2, 0.1, 0.1, 0x00cc88, 10, 0.45, -2.8);

    createPart(1, 2, 1, 0xff6b6b, 12.5, 1.15, 2.5);
    createPart(1, 3, 1, 0xffcc00, 7.5, 1.65, 2.5);

    
    createPart(6, 0.3, 6, 0xcc8844, -10, 0.15, 0);
    createPart(5, 3.5, 0.3, 0x222244, -10, 2.2, -2.85);
    createPart(5.2, 0.1, 0.1, 0xffcc00, -10, 4.0, -2.8);
    createPart(5.2, 0.1, 0.1, 0xffcc00, -10, 0.45, -2.8);
   
    createPart(1, 1, 1, 0x00cc88, -12.5, 0.65, 2.5);
    createPart(1, 4, 1, 0xe94560, -7.5, 2.15, 2.5);


    createPart(8, 0.3, 6, 0x886644, 0, 0.15, 12);
    createPart(7, 3.5, 0.3, 0x222244, 0, 2.2, 9.15);
    createPart(7.2, 0.1, 0.1, 0xe94560, 0, 4.0, 9.2);
    createPart(7.2, 0.1, 0.1, 0xe94560, 0, 0.45, 9.2);

    createNoob(7.5, 0.15, -2, Math.PI * 0.7);
    createNoob(-7.5, 0.15, -2, -Math.PI * 0.7);
    createNoob(3, 0.15, 11, Math.PI);
    createNoob(-3, 0.15, 11, Math.PI);

    
    function createTree(x, z) {
      createPart(0.6, 3, 0.6, 0x8b5a2b, x, 1.5, z);
      const leafColor = 0x228B22;
      createPart(2.5, 2, 2.5, leafColor, x, 3.5, z);
      createPart(2, 1.5, 2, leafColor, x, 4.8, z);
      createPart(1.2, 1, 1.2, leafColor, x, 5.8, z);
    }
    createTree(-8, -8);
    createTree(8, -8);
    createTree(-12, 8);
    createTree(12, 8);
    createTree(-5, -10);
    createTree(5, -10);

    function createSpawnPad(x, z) {
      const pad = createPart(2, 0.15, 2, 0x333333, x, 0.075, z);
      createPart(1.8, 0.05, 1.8, 0x00cc88, x, 0.15, z);
      return pad;
    }
    createSpawnPad(-3, 5);
    createSpawnPad(3, 5);

    scene.fog = new THREE.FogExp2(0x8899cc, 0.012);
    function createTextSprite(text, fontSize, color, bgColor, w, h) {
      const canvas = document.createElement('canvas');
      canvas.width = w || 1024;
      canvas.height = h || 256;
      const ctx = canvas.getContext('2d');
      if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.fillStyle = color || 'white';
      ctx.font = `bold ${fontSize || 60}px 'Arial', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';


      const lines = text.split('\n');
      const lineHeight = (fontSize || 60) * 1.3;
      const startY = canvas.height / 2 - (lines.length - 1) * lineHeight / 2;
      lines.forEach((line, i) => {
        ctx.fillText(line, canvas.width / 2, startY + i * lineHeight);
      });

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      return texture;
    }

    function addTextPlane(text, fontSize, color, bg, w, h, pos, rot, scaleX, scaleY) {
      const tex = createTextSprite(text, fontSize, color, bg, w, h);
      const geo = new THREE.PlaneGeometry(scaleX, scaleY);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos[0], pos[1], pos[2]);
      if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
      scene.add(mesh);
      return mesh;
    }


    addTextPlane('RAUNAK MONDAL', 90, '#ffffff', null, 1024, 128,
      [0, 3.4, -3.68], [0, 0, 0], 6, 0.75);
    addTextPlane('CS @ Carnegie Mellon', 50, '#e94560', null, 1024, 96,
      [0, 2.4, -3.68], [0, 0, 0], 5, 0.47);
    addTextPlane('SCS Class of 2029', 40, '#aabbcc', null, 1024, 96,
      [0, 1.7, -3.68], [0, 0, 0], 4, 0.37);


    addTextPlane('ABOUT ME', 70, '#00cc88', null, 512, 96,
      [10, 3.6, -2.68], [0, 0, 0], 4, 0.6);
    addTextPlane('Click to learn more →', 36, '#aabbcc', null, 512, 64,
      [10, 1.0, -2.68], [0, 0, 0], 3.5, 0.4);

    
    addTextPlane('EXPERIENCE', 70, '#ffcc00', null, 512, 96,
      [-10, 3.6, -2.68], [0, 0, 0], 4, 0.6);
    addTextPlane('← Click to learn more', 36, '#aabbcc', null, 512, 64,
      [-10, 1.0, -2.68], [0, 0, 0], 3.5, 0.4);

    addTextPlane('PROJECTS', 70, '#e94560', null, 512, 96,
      [0, 3.6, 9.32], [0, Math.PI, 0], 4, 0.6);
    addTextPlane('Click below to explore', 36, '#aabbcc', null, 512, 64,
      [0, 1.0, 9.32], [0, Math.PI, 0], 3.5, 0.4);
    addTextPlane('GitHub', 40, '#ffffff', '#333333', 256, 64,
      [-2, 0.48, 3.5], [-Math.PI/2, 0, 0], 1.8, 0.45);
    addTextPlane('LinkedIn', 40, '#ffffff', '#0077b5', 256, 64,
      [0, 0.48, 3.5], [-Math.PI/2, 0, 0], 1.8, 0.45);
    addTextPlane('Email', 40, '#ffffff', '#e94560', 256, 64,
      [2, 0.48, 3.5], [-Math.PI/2, 0, 0], 1.8, 0.45);
    const clickableAreas = [];

    function addClickZone(x, y, z, w, h, d, callback) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.userData.clickCallback = callback;
      scene.add(mesh);
      clickableAreas.push(mesh);
      return mesh;
    }

    addClickZone(-2, 0.48, 3.5, 1.8, 0.5, 0.5, () => {
      window.open('https://github.com/raunakmondal', '_blank');
    });
    addClickZone(0, 0.48, 3.5, 1.8, 0.5, 0.5, () => {
      window.open('https://www.linkedin.com/in/raunak-mondal/', '_blank');
    });
    addClickZone(2, 0.48, 3.5, 1.8, 0.5, 0.5, () => {
      navigator.clipboard.writeText('rmondal@andrew.cmu.edu');
      const n = document.getElementById('notif');
      n.classList.add('show');
      setTimeout(() => n.classList.remove('show'), 2000);
    });
    const modal = {
      pages: [], currentPage: 0, isOpen: false, title: ''
    };

    function openModal(title, pages) {
      modal.title = title;
      modal.pages = pages;
      modal.currentPage = 0;
      modal.isOpen = true;
      document.getElementById('modalTitle').textContent = title;
      renderModalPage();
      document.getElementById('infoModal').classList.add('active');
    }

    function closeModal() {
      modal.isOpen = false;
      document.getElementById('infoModal').classList.remove('active');
    }

    function renderModalPage() {
      document.getElementById('modalBody').innerHTML = modal.pages[modal.currentPage];
      document.getElementById('modalPrev').disabled = modal.currentPage === 0;
      document.getElementById('modalNext').disabled = modal.currentPage === modal.pages.length - 1;
      document.getElementById('modalTitle').textContent =
        modal.title + (modal.pages.length > 1 ? ` (${modal.currentPage + 1}/${modal.pages.length})` : '');
    }

    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('infoModal').onclick = (e) => {
      if (e.target === document.getElementById('infoModal')) closeModal();
    };
    document.getElementById('modalPrev').onclick = () => {
      if (modal.currentPage > 0) { modal.currentPage--; renderModalPage(); }
    };
    document.getElementById('modalNext').onclick = () => {
      if (modal.currentPage < modal.pages.length - 1) { modal.currentPage++; renderModalPage(); }
    };
    const aboutPages = [
      `<h3>👋 Hi! I'm Raunak Mondal</h3>
       <p>I'm a Computer Science student at <strong>Carnegie Mellon University</strong>, School of Computer Science (Class of 2029).</p>
       <p>I'm passionate about AI/ML, bioinformatics, and building impactful technology. I've published research papers at top conferences and love tackling challenging problems.</p>
       <h3>🛠️ Skills</h3>
       <p>
         <span class="tag">C</span>
         <span class="tag">Python</span>
         <span class="tag">Java</span>
         <span class="tag">HTML/JS</span>
         <span class="tag">PyTorch</span>
         <span class="tag">NumPy</span>
         <span class="tag">TensorFlow</span>
         <span class="tag">LLMs</span>
         <span class="tag">Debugging Tools</span>
       </p>`,
      `<h3>📚 Relevant Courses</h3>
       <p>CMU 15-122 — Principles of Imperative Computation (Data Structures in C)</p>
       <p>CMU 15-151 — Mathematical Foundations for Computer Science</p>
       <p>CMU 21-241 — Matrices and Linear Transformations</p>
       <p>CMU 15-213 — Introduction to Computer Systems</p>
       <p>CMU 15-150 — Principles of Functional Programming</p>
       <p>CMU 07-180 — Concepts of Artificial Intelligence</p>
       <p>AP Computer Science Principles & AP Computer Science A</p>
       <p>Multi-Variable Calculus</p>`,
      `<h3>🏆 Honors & Awards</h3>
       <p>🎓 Math research at Stanford University Math Camp (SUMaC), 2024</p>
       <p>🥇 2023 ARML: Top 50 nationally</p>
       <p>📝 National Merit Finalist, 2024–2025</p>
       <p>🏅 Coca-Cola Scholar Semifinalist, 2024–2025</p>
       <p>🥈 2nd place — Southern California Science Olympiad, 2023 at Caltech</p>
       <p>🧮 21st place — Harvard-MIT Mathematics Tournament (HMMT) Guts Round</p>`
    ];

    const experiencePages = [
      `<h3>🔬 Student Researcher — University of Hawaii, Manoa</h3>
       <p><em>Hawaii Digital Health Lab</em></p>
       <p>Built an LSTM-based ML model to detect autism through behavioral videos of children. First author of the resulting paper, accepted at AMIA 2024.</p>
       <h3>📄 Publications</h3>
       <p>"Which sequence-based neural network architecture yields optimal performance in classification of autism-related behavior" — <strong>AMIA 2024</strong> (1st Author)</p>
       <p>"Are Robots Ready to Deliver Autism Inclusion" — <strong>ACM CHI 2024</strong> (Co-author)</p>`,
      `<h3>🔬 Research Intern — UCSD, Dept. of Computer Science</h3>
       <p>Created a dataset to analyze ableism in research & social media. Implemented LLM-based mechanisms to detect ableist text using prompt engineering.</p>
       <h3>🔋 Student Researcher — UCSD MRSEC</h3>
       <p>Synthesized Li-ion battery anodes and used ML/data science to find optimal Atomic Packing Factor of various materials. Built a computational model for Magnetic Self-Assembly Simulation.</p>`,
      `<h3>🧬 CureScience Scholars — UC San Diego</h3>
       <p>Analyzed possible genetic causes of autism and neurological disorders using bioinformatic tools, presented findings at the symposium.</p>
       <h3>💻 ScottyLabs — Carnegie Mellon University</h3>
       <p>Lead developer for the GSA Student Housing project, delegating tasks to a 10-member team to build a website helping CMU students find off-campus housing.</p>
       <h3>🧠 Prof. Victoria Castillo — Ohio State / UCSD</h3>
       <p>Assessed the impact of structural racism on neurocognition as part of an NIH-funded research project.</p>`
    ];

    const projectPages = [
      `<h3>🤖 Autism Detection via LSTM Networks</h3>
       <p>Built a mechanism to detect autism through behavioral videos of children using LSTM-based machine learning. Published findings as first author at AMIA 2024.</p>
       <p><span class="tag">Python</span><span class="tag">PyTorch</span><span class="tag">LSTM</span><span class="tag">Computer Vision</span></p>`,
      `<h3>📊 Ableism Detection in Social Media</h3>
       <p>Created datasets and implemented LLM-powered mechanisms to identify ableist language in research papers and social media posts. Co-authored paper at ACM CHI 2024.</p>
       <p><span class="tag">LLMs</span><span class="tag">NLP</span><span class="tag">Prompt Engineering</span><span class="tag">Data Science</span></p>`,
      `<h3>🔋 Li-ion Battery Optimization</h3>
       <p>Used machine learning to optimize Atomic Packing Factors for battery anode materials. Presented at UCSD Student Research Conference.</p>
       <p><span class="tag">ML</span><span class="tag">Materials Science</span><span class="tag">Data Science</span></p>`,
      `<h3>🏠 GSA Student Housing (ScottyLabs)</h3>
       <p>Led a team of 10 at CMU's ScottyLabs to build a comprehensive off-campus housing information website for graduate students.</p>
       <p><span class="tag">HTML/JS</span><span class="tag">Team Lead</span><span class="tag">Web Dev</span></p>`
    ];
    let currentLocation = 0;
    const navLeft = document.querySelector('.side-nav.left');
    const navRight = document.querySelector('.side-nav.right');
    const navBottom = document.querySelector('.side-nav.bottom');

    function showNavs() {
      [navLeft, navRight, navBottom].forEach(n => {
        n.style.opacity = '1';
        n.style.pointerEvents = 'auto';
      });
    }
    function hideNavs() {
      [navLeft, navRight, navBottom].forEach(n => {
        n.style.opacity = '0';
        n.style.pointerEvents = 'none';
      });
    }

    const cameraTargets = {
      home: { pos: [0, 4, 12], look: [0, 2, 0] },
      about: { pos: [10, 4, 8], look: [10, 2, -1] },
      experience: { pos: [-10, 4, 8], look: [-10, 2, -1] },
      projects: { pos: [0, 4, 20], look: [0, 2, 10] }
    };

    let camAnimating = false;
    let camAnimStart = null;
    let camAnimDuration = 1200;
    let camStartPos = new THREE.Vector3();
    let camEndPos = new THREE.Vector3();
    let camStartLook = new THREE.Vector3();
    let camEndLook = new THREE.Vector3();
    let currentLookAt = new THREE.Vector3(0, 2, 0);

    function animateCamera(target, callback) {
      camAnimating = true;
      camAnimStart = performance.now();
      camStartPos.copy(camera.position);
      camEndPos.set(...target.pos);
      camStartLook.copy(currentLookAt);
      camEndLook.set(...target.look);
      hideNavs();
      const onFinish = () => {
        camAnimating = false;
        currentLookAt.copy(camEndLook);
        updateNavButtons();
        showNavs();
        if (callback) callback();
      };
      setTimeout(onFinish, camAnimDuration + 50);
    }

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function updateNavButtons() {
      const lb = document.getElementById('navLeftBtn');
      const rb = document.getElementById('navRightBtn');
      const bb = document.getElementById('navBottomBtn');
      if (currentLocation === 0) {
        lb.textContent = 'Experience'; rb.textContent = 'About Me'; bb.textContent = 'Projects';
      } else if (currentLocation === 1) { 
        lb.textContent = 'Home'; rb.textContent = 'Projects'; bb.textContent = 'Experience';
      } else if (currentLocation === 2) { 
        lb.textContent = 'Projects'; rb.textContent = 'Home'; bb.textContent = 'About Me';
      } else if (currentLocation === 3) { 
        lb.textContent = 'Home'; rb.textContent = 'Experience'; bb.textContent = 'About Me';
      }
    }

    function navigateTo(loc) {
      currentLocation = loc;
      const targets = ['home', 'about', 'experience', 'projects'];
      animateCamera(cameraTargets[targets[loc]], () => {
        if (loc === 1) openModal('About Me', aboutPages);
        else if (loc === 2) openModal('Experience', experiencePages);
        else if (loc === 3) openModal('Projects', projectPages);
      });
    }

    navRight.onclick = () => {
      if (camAnimating) return;
      if (currentLocation === 0) navigateTo(1);
      else if (currentLocation === 1) navigateTo(3);
      else if (currentLocation === 2) navigateTo(0);
      else if (currentLocation === 3) navigateTo(2);
    };
    navLeft.onclick = () => {
      if (camAnimating) return;
      if (currentLocation === 0) navigateTo(2);
      else if (currentLocation === 1) navigateTo(0);
      else if (currentLocation === 2) navigateTo(3);
      else if (currentLocation === 3) navigateTo(0);
    };
    navBottom.onclick = () => {
      if (camAnimating) return;
      if (currentLocation === 0) navigateTo(3);
      else if (currentLocation === 1) navigateTo(2);
      else if (currentLocation === 2) navigateTo(1);
      else if (currentLocation === 3) navigateTo(1);
    };

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (modal.isOpen) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(clickableAreas);
      if (hits.length > 0 && hits[0].object.userData.clickCallback) {
        hits[0].object.userData.clickCallback();
      }
    });
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      if (modal.isOpen || camAnimating) return;
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = (e.clientY / window.innerHeight) * 2 - 1;
    }, { passive: true });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      if (mainNoob) {
        mainNoob.position.y = 0.4 + Math.sin(elapsed * 2) * 0.1;
        mainNoob.rotation.y = Math.sin(elapsed * 0.5) * 0.2;
      }

      if (camAnimating && camAnimStart) {
        const t = Math.min((performance.now() - camAnimStart) / camAnimDuration, 1);
        const e = easeInOut(t);
        camera.position.lerpVectors(camStartPos, camEndPos, e);
        const look = new THREE.Vector3().lerpVectors(camStartLook, camEndLook, e);
        camera.lookAt(look);
        currentLookAt.copy(look);
      } else {
        const targetLook = currentLookAt.clone();
        targetLook.x += mouseX * 1.5;
        targetLook.y += -mouseY * 0.8;
        camera.lookAt(targetLook);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    let loadStep = 0;
    const loadInterval = setInterval(() => {
      loadStep += 0.02 + Math.random() * 0.03;
      if (loadStep >= 1) {
        loadStep = 1;
        clearInterval(loadInterval);
      }
      setLoadProgress(loadStep);
    }, 60);

    document.getElementById('loadingScreen').addEventListener('click', () => {
      if (loadProgress >= 1) {
        const s = document.getElementById('loadingScreen');
        s.classList.add('fade-out');
        setTimeout(() => {
          s.style.display = 'none';
          showNavs();
        }, 500);
      }
    });

    updateNavButtons();
    animate();
  </script>
</body>
