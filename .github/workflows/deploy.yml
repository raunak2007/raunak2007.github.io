name: Deploy with Real GitHub Data

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Daily update
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch GitHub Data
        run: |
          curl -X POST \
            -H "Authorization: bearer ${{ secrets.token }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"query{user(login:\"raunak2007\"){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{contributionCount date}}}}repositories(first:100,isFork:false){totalCount}}}"}' \
            https://api.github.com/graphql > github-data.json
          
          # Escape JSON for injection
          DATA=$(cat github-data.json | jq -c .)
          sed -i "s/__GITHUB_DATA_PLACEHOLDER__/$DATA/" index.html
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.token }}
          publish_dir: ./
