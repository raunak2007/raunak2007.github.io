name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Update stats daily

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Fetch GitHub Stats
        run: |
          # Fetch real contribution data using your token (safe in CI)
          curl -H "Authorization: bearer ${{ secrets.TOKEN }}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d '{"query":"query{user(login:\"raunak2007\"){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{contributionCount date}}}}repositories(first:100,isFork:false){totalCount}}}"}' \
               https://api.github.com/graphql > github-stats.json
          
          # Create a JavaScript file with the data
          echo "// Auto-generated at $(date)" > github-data.js
          echo "window.GITHUB_DATA = $(cat github-stats.json);" >> github-data.js
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
